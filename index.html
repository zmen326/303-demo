<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Power bank vending machine Prototype</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .phone {
      width: 100%;
      max-width: 380px;
    }
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 24px;
    }
    .hidden { display: none; }
    .center { text-align: center; }
    .icon-box {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }
    h1, h2, p { margin: 0; }
    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-top: 8px;
    }
    .qr-box {
      margin-top: 20px;
      border: 2px dashed #cbd5e1;
      border-radius: 24px;
      background: #f8fafc;
      padding: 24px;
      text-align: center;
    }
    .fake-qr {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px;
      background:
        linear-gradient(90deg, #111 10px, transparent 10px) 0 0/20px 20px,
        linear-gradient(#111 10px, transparent 10px) 0 0/20px 20px,
        linear-gradient(90deg, transparent 10px, #111 10px) 10px 10px/20px 20px,
        linear-gradient(transparent 10px, #111 10px) 10px 10px/20px 20px,
        #fff;
      border: 8px solid #111;
      border-radius: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
    }
    .info-box {
      background: #f8fafc;
      border-radius: 18px;
      padding: 16px;
    }
    .info-label {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .info-value {
      font-size: 20px;
      font-weight: bold;
    }
    .btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s;
    }
    .btn-primary {
      background: #0f172a;
      color: white;
    }
    .btn-primary:hover { opacity: 0.92; }
    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .btn-secondary:hover { opacity: 0.92; }
    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e2e8f0;
      font-size: 14px;
      font-weight: bold;
    }
    .timer-box {
      margin-top: 20px;
      background: #0f172a;
      color: white;
      border-radius: 24px;
      padding: 24px;
      text-align: center;
    }
    .timer-label {
      color: #cbd5e1;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .timer {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div id="homePage" class="card">
      <div class="icon-box">🔋</div>
      <div class="center">
        <h1>Veding machine Prototype</h1>
        <p class="subtitle">Click to scan the QR code</p>
      </div>

      <div class="qr-box">
        <div class="fake-qr"></div>
        <p><strong>QR code scanner</strong></p>
        <p class="subtitle"></p>
      </div>

      <div class="grid">
        <div class="info-box">
          <div class="info-label">Charging rules</div>
          <div class="info-value">$0.50/15 mins</div>
        </div>
        <div class="info-box">
          <div class="info-label">Flow</div>
          <div class="info-value">Vending => Returning</div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="startRental()">Borrow one now!</button>
    </div>

    <div id="rentalPage" class="card hidden">
      <div class="center">
        <span class="badge">Timing</span>
        <h2 style="margin-top:16px;">Power bank on use</h2>
        <p class="subtitle">   </p>
      </div>

      <div class="timer-box">
        <div class="timer-label">Time used</div>
        <div id="timer" class="timer">00:00:00</div>
      </div>

      <div class="grid">
        <div class="info-box">
          <div class="info-label">Charge</div>
          <div id="fee" class="info-value">$0.00</div>
        </div>
        <div class="info-box">
          <div class="info-label">Status</div>
          <div class="info-value">On use</div>
        </div>
      </div>

      <button class="btn btn-secondary" onclick="returnPowerbank()">Return the powerbank </button>
    </div>

    <div id="returnedPage" class="card hidden">
      <div class="success-icon">✓</div>
      <div class="center">
        <h2>Return succseefully</h2>
        <p class="subtitle" style="margin-top:8px;">End, back to homepage</p>
      </div>
      <button class="btn btn-primary" onclick="goHome()">Back to homepage</button>
    </div>
  </div>

  <script>
    let startTime = null;
    let timerInterval = null;
    const ratePerMinute = 0.5;

    function showPage(pageId) {
      document.getElementById('homePage').classList.add('hidden');
      document.getElementById('rentalPage').classList.add('hidden');
      document.getElementById('returnedPage').classList.add('hidden');
      document.getElementById(pageId).classList.remove('hidden');
    }

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
    }

    function startRental() {
      startTime = Date.now();
      showPage('rentalPage');

      timerInterval = setInterval(() => {
        const elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
        const minutes = elapsedSeconds / 60;
        const fee = (minutes * ratePerMinute).toFixed(2);

        document.getElementById('timer').textContent = formatTime(elapsedSeconds);
        document.getElementById('fee').textContent = '$' + fee;
      }, 1000);
    }

    function returnPowerbank() {
      clearInterval(timerInterval);
      timerInterval = null;
      startTime = null;
      showPage('returnedPage');
    }

    function goHome() {
      document.getElementById('timer').textContent = '00:00:00';
      document.getElementById('fee').textContent = '$0.00';
      showPage('homePage');
    }
  </script>
</body>
</html>
